<path d="M 466 101 L 516 101" fill="none" stroke="#84c959" stroke-width="2" marker-end="url(#g)"/>
<path d="M 226 257 L 276 257" fill="none" stroke="#84c959" stroke-width="2" marker-end="url(#g)"/>
<path d="M 466 246 L 616 246 L 616 180" fill="none" stroke="#84c959" stroke-width="2" marker-end="url(#g)"/>
<text x="548" y="238" font-size="11" fill="#84c959" font-weight="normal" text-anchor="middle">a la llamada</text>
<path d="M 466 272 L 766 272" fill="none" stroke="#84c959" stroke-width="2" marker-end="url(#g)"/>
<text x="616" y="290" font-size="11" fill="#84c959" font-weight="normal" text-anchor="middle">lo escuchas tú</text>
<path d="M 716 101 L 766 101" fill="none" stroke="#84c959" stroke-width="2" marker-end="url(#g)"/>
<path d="M 856 132 L 856 158" fill="none" stroke="#84c959" stroke-width="2" marker-end="url(#g)"/>
<path d="M 946 112 L 958 112 L 958 248 L 946 248" fill="none" stroke="#84c959" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>
<text x="952" y="340" font-size="11" fill="#84c959" font-weight="normal" text-anchor="end">MONITOR: te escuchas</text>
<text x="952" y="356" font-size="11" fill="#8a978d" font-weight="normal" text-anchor="end">(Mezcla o una entrada → Salida)</text>
<text x="36" y="330" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">SINC compensa la latencia: quien toca sobre la música la oye tarde,</text>
<text x="36" y="348" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">así que la música se retrasa solo hacia la llamada (evoctl calibrate).</text>
<rect x="16" y="392" width="948" height="232" rx="10" fill="#161d21" stroke="#2f3c42"/>
<text x="32" y="418" font-size="12" fill="#e8b53f" font-weight="bold" text-anchor="start">CONTROL</text>
<text x="110" y="418" font-size="12" fill="#8a978d" font-weight="normal" text-anchor="start">quién mueve cada cosa</text>
<rect x="36" y="450" width="190" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="48" y="474" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">evo8-mixer</text>
<text x="48" y="492" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">la ventana</text>
<rect x="36" y="530" width="190" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="48" y="554" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">evoctl</text>
<text x="48" y="572" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">la línea de comandos</text>
<rect x="276" y="484" width="190" height="72" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="288" y="508" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">librería evo8</text>
<text x="288" y="526" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">Python: un solo lugar</text>
<text x="288" y="544" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">para la lógica</text>
<rect x="516" y="442" width="200" height="66" rx="6" fill="#1c2529" stroke="#7fb4d9" stroke-width="2"/>
<text x="528" y="466" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">PipeWire</text>
<text x="528" y="484" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">pw-cli · pactl · pw-link</text>
<text x="528" y="502" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">al instante, sin cortes</text>
<rect x="516" y="532" width="200" height="66" rx="6" fill="#1c2529" stroke="#e8b53f" stroke-width="2"/>
<text x="528" y="556" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">USB · UAC2</text>
<text x="528" y="574" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">suelta el driver ~0,1 s</text>
<text x="528" y="592" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">corta el audio un momento</text>
<rect x="766" y="442" width="180" height="156" rx="6" fill="#1c2529" stroke="#e8b53f" stroke-width="2"/>
<text x="778" y="466" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">EVO 8 hardware</text>
<text x="778" y="484" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">mezcla interna 10×4</text>
<text x="778" y="502" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">  (monitoreo directo,</text>
<text x="778" y="520" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">   sin latencia)</text>
<text x="778" y="538" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">loop-back</text>
<text x="778" y="556" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">preamps · 48 V</text>
<text x="778" y="574" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">silencio por entrada</text>
