<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, Consolas, monospace">
<title>Cómo funciona evo8-linux</title>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84c959"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8b53f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7fb4d9"/></marker></defs>
<rect width="980" height="640" rx="14" fill="#12171a"/>
<rect x="16" y="16" width="948" height="352" rx="10" fill="#161d21" stroke="#2f3c42"/>
<text x="32" y="42" font-size="12" fill="#84c959" font-weight="bold" text-anchor="start">AUDIO</text>
<text x="92" y="42" font-size="12" fill="#8a978d" font-weight="normal" text-anchor="start">lo que entra a la llamada y lo que escuchas (PipeWire)</text>
<rect x="36" y="70" width="190" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="48" y="94" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">EVO 8 · IN 1-2</text>
<text x="48" y="112" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">entradas de la interfaz</text>
<rect x="36" y="226" width="190" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="48" y="250" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">Apps</text>
<text x="48" y="268" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">YouTube, metrónomo,</text>
<text x="48" y="286" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">backing tracks</text>
<rect x="276" y="70" width="190" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="288" y="94" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">Entradas</text>
<text x="288" y="112" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">mezcla.entradas</text>
<rect x="276" y="226" width="190" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="288" y="250" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">Compartido</text>
<text x="288" y="268" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">salida virtual:</text>
<text x="288" y="286" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">le mandas apps</text>
<rect x="516" y="62" width="200" height="118" rx="6" fill="#1c2529" stroke="#84c959" stroke-width="2"/>
<text x="528" y="86" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">Suma</text>
<text x="574" y="86" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">mezcla.suma</text>
<rect x="526" y="100" width="180" height="26" rx="4" fill="#12171a" stroke="#2f3c42"/>
<text x="534" y="117" font-size="10.5" fill="#84c959" font-weight="bold" text-anchor="start">SINC</text>
<text x="578" y="117" font-size="10.5" fill="#d6dfd2" font-weight="normal" text-anchor="start">retrasa Compartido</text>
<rect x="526" y="134" width="180" height="26" rx="4" fill="#12171a" stroke="#2f3c42"/>
<text x="534" y="151" font-size="10.5" fill="#84c959" font-weight="bold" text-anchor="start">FADER</text>
<text x="578" y="151" font-size="10.5" fill="#d6dfd2" font-weight="normal" text-anchor="start">ganancia por canal</text>
<rect x="766" y="70" width="180" height="62" rx="6" fill="#1c2529" stroke="#84c959" stroke-width="2"/>
<text x="778" y="94" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">Mezcla</text>
<text x="778" y="112" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">micrófono virtual</text>
<rect x="766" y="226" width="180" height="62" rx="6" fill="#1c2529" stroke="#2f3c42" stroke-width="1.5"/>
<text x="778" y="250" font-size="14" fill="#d6dfd2" font-weight="bold" text-anchor="start">Salida</text>
<text x="778" y="268" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">la seleccionada:</text>
<text x="778" y="286" font-size="11.5" fill="#8a978d" font-weight="normal" text-anchor="start">audífonos o parlantes</text>
<rect x="776" y="158" width="160" height="30" rx="15" fill="#12171a" stroke="#2f3c42"/>
<text x="856" y="178" font-size="11.5" fill="#d6dfd2" font-weight="normal" text-anchor="middle">Meet · Zoom · OBS</text>
