# Los navegadores aplican control automático de ganancia (AGC) en videollamadas
# y cambian por su cuenta el volumen del micrófono del sistema: Meet puede ir
# bajando la Mezcla en plena llamada. Esto bloquea que esas apps cambien el
# volumen de cualquier entrada; se sigue ajustando desde el mezclador (evo8-mixer) o evoctl.
pulse.rules = [
    {
        matches = [
            { application.process.binary = "chrome" }
            { application.process.binary = "chromium" }
            { application.process.binary = "firefox" }
        ]
        actions = {
            quirks = [ block-source-volume ]
        }
    }
]
