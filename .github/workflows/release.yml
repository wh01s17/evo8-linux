name: Release

# Pushing a tag like v0.1.0 publishes that version to PyPI.
# PyPI trusts this workflow through trusted publishing (no token stored here):
# the project's publisher on pypi.org must name this repo, release.yml and the
# "pypi" environment.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import evo8; print(evo8.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evo8-linux/
    permissions:
      id-token: write     # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
