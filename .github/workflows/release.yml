name: Release

# Pushing a tag like v0.1.0 publishes that version to PyPI and creates the
# GitHub release with that version's CHANGELOG.md section. Steps: PUBLISH.md.
# PyPI trusts this workflow through trusted publishing (no token stored here):
# the project's publisher on pypi.org must name this repo, release.yml and the
# "pypi" environment.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import evo8; print(evo8.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - name: CHANGELOG.md has this version
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evo8-linux/
    permissions:
      id-token: write     # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the release with the changelog and the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "evo8-linux ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
