name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git make python python-pyusb pyside6 qt6-svg nodejs
      - uses: actions/checkout@v5
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test

  wheel:
    name: Python package (pip, Ubuntu, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries for the PySide6 wheel
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: The wheel carries the data files
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          need = ["evo8/data/evo8-mixer.svg",
                  "evo8/data/pipewire/pipewire.conf.d/20-mezcla.conf",
                  "evo8/data/pipewire/pipewire-pulse.conf.d/20-bloquear-volumen-micro.conf",
                  "evo8/data/udev/70-audient-evo8.rules",
                  "evo8/data/systemd/evo8-restore.service",
                  "evo8/data/applications/evo8-mixer.desktop",
                  "evo8/gui/qml/Main.qml", "evo8/gui/qml/qmldir"]
          missing = [n for n in need if n not in names]
          assert not missing, missing
          EOF
      - name: Install the wheel the way a user would
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[gui,usb]"
          /tmp/venv/bin/evoctl --version
      - name: Run the tests against the installed package
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/venv/bin/python -m unittest discover -s tests -v
      - name: evoctl setup in a clean home
        run: |
          export HOME=$(mktemp -d) XDG_CONFIG_HOME= XDG_DATA_HOME=
          /tmp/venv/bin/evoctl setup || true      # exits 1: no PipeWire on the runner
          test -f "$HOME/.config/pipewire/pipewire.conf.d/20-mezcla.conf"
          grep -q "^ExecStart=/tmp/venv/bin/evoctl restore" "$HOME/.config/systemd/user/evo8-restore.service"
          grep -q "^Exec=/tmp/venv/bin/evo8-mixer" "$HOME/.local/share/applications/evo8-mixer.desktop"
          /tmp/venv/bin/evoctl setup --remove
          test ! -e "$HOME/.config/pipewire/pipewire.conf.d/20-mezcla.conf"

  package:
    name: Build the Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: test
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git namcap sudo
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # pkgver counts commits
      - name: Prepare an unprivileged builder (makepkg refuses root)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sudo -u builder git config --global --add safe.directory '*'
          cp -r packaging/arch /home/builder/pkg
          # Build this exact commit, not whatever is on GitHub's main.
          sed -i "s|git+https://github.com/wh01s17/evo8-linux.git|git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA|" \
            /home/builder/pkg/PKGBUILD
          chown -R builder:builder /home/builder/pkg
      - name: Lint PKGBUILD
        run: namcap packaging/arch/PKGBUILD
      - name: makepkg
        working-directory: /home/builder/pkg
        env:
          QT_QPA_PLATFORM: offscreen
        run: sudo -u builder --preserve-env=QT_QPA_PLATFORM makepkg -s --noconfirm
      - name: Lint package
        working-directory: /home/builder/pkg
        run: namcap evo8-linux-git-*.pkg.tar.zst
      - name: Install and smoke test
        working-directory: /home/builder/pkg
        run: |
          pacman -U --noconfirm evo8-linux-git-*.pkg.tar.zst
          evoctl --help
          python -c "import evo8.gui.app, evo8.usb, evo8.hw"
          test -f /usr/lib/python3*/site-packages/evo8/gui/qml/Main.qml
          grep -q '^ExecStart=/usr/bin/evoctl restore' /usr/lib/systemd/user/evo8-restore.service
          test -f /usr/share/pipewire/pipewire.conf.d/20-mezcla.conf
          test -f /usr/lib/udev/rules.d/70-audient-evo8.rules
          test -f /usr/share/icons/hicolor/scalable/apps/evo8-mixer.svg
          test -f /usr/lib/python3*/site-packages/evo8/data/evo8-mixer.svg
      - uses: actions/upload-artifact@v7
        with:
          name: evo8-linux-git
          path: /home/builder/pkg/*.pkg.tar.zst
