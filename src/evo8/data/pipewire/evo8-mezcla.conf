# Micrófono virtual "Mezcla" (Audient EVO 8 en perfil "Pro Audio").
#
# Corre como un proceso aparte de PipeWire (evo8-mezcla.service, igual que el
# filter-chain.service de PipeWire), no como drop-in del daemon: así se enciende
# y se apaga sin reiniciar PipeWire ni cortar el audio del resto
# (`evoctl mezcla on|off`, o el interruptor de la ventana). Apagado, Mezcla y
# Compartido no existen y las apps que estaban en Compartido vuelven a la
# salida seleccionada.
#
#   EVO entradas 1-4 ─┐
#                     ├─► mezcla.suma ─► Mezcla  (micrófono virtual, mono)
#   Compartido ───────┘
#        │
#        └─► salida seleccionada
#
# "Compartido" es una salida virtual: lo que suena ahí se escucha por la salida
# seleccionada y además entra en la Mezcla.
#
# Los puentes con destino fijo usan dont-fallback + linger: si su destino
# desaparece (la EVO se desconecta un instante), esperan y se reconectan solos
# cuando vuelve, en vez de pasarse a otro dispositivo o destruirse.
#
# Volumen de cada parte en la mezcla ("Gain N"):
#   1 = entrada 1, 2 = entrada 2, 3/4 = Compartido L/R, 5 = entrada 3,
#   6 = entrada 4 (3-4 al final para no cambiar lo que ya significaban 1-4).
# Las cuatro entradas están siempre conectadas; las que no están "en la
# Mezcla" (botón + de la ventana, `evoctl mezcla add|remove`) van con
# ganancia 0, así agregarlas o quitarlas es instantáneo y no corta nada.
# Aquí empiezan en la Mezcla las entradas 1-2; `evoctl apply` pone lo guardado.
#
# Compensación de latencia ("compL"/"compR", "Delay (s)"): quien toca oye
# Compartido con el retardo de la salida y su instrumento vuelve con el de la
# entrada, así que en la suma el instrumento llega tarde respecto de la música.
# Retrasar Compartido *solo hacia la suma* los alinea sin cambiar lo que se
# oye. `evoctl calibrate` mide el valor; `evoctl delay set` lo aplica en vivo
# y `evoctl apply` lo restaura.
#
# Los puentes llevan state.restore-props = false: el volumen y el silencio que
# les pone el sistema (el monitor silencia la escucha) no deben volver solos
# tras un reinicio.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Cliente de PipeWire: lo mínimo para crear nodos en el daemon.
    {   name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    {   name = libpipewire-module-protocol-native }
    {   name = libpipewire-module-client-node }
    {   name = libpipewire-module-adapter }

    # Sumador: sink interno de 6 canales que sale como micrófono mono.
    # Canales: FL/FR = entradas 1-2, RL/RR = Compartido L/R, SL/SR = entradas
    # 3-4. (Posiciones estándar: con AUX0/AUX1 el sink entregaba silencio en
    # esos canales.)
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Mezcla (suma interna)"
            media.name       = "Mezcla"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = mix
                        label   = mixer
                        control = { "Gain 1" = 1.0  "Gain 2" = 1.0  "Gain 3" = 0.5  "Gain 4" = 0.5
                                    "Gain 5" = 0.0  "Gain 6" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = compL
                        label   = delay
                        config  = { "max-delay" = 1 }
                        control = { "Delay (s)" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = compR
                        label   = delay
                        config  = { "max-delay" = 1 }
                        control = { "Delay (s)" = 0.0 }
                    }
                ]
                links = [
                    { output = "compL:Out" input = "mix:In 3" }
                    { output = "compR:Out" input = "mix:In 4" }
                ]
                inputs  = [ "mix:In 1" "mix:In 2" "compL:In" "compR:In" "mix:In 5" "mix:In 6" ]
                outputs = [ "mix:Out" ]
            }
            capture.props = {
                node.name        = "mezcla.suma"
                media.class      = Audio/Sink
                audio.position   = [ FL FR RL RR SL SR ]
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = {
                node.name        = "Mezcla"
                node.description = "Mezcla (entradas + Compartido)"
                media.class      = Audio/Source
                audio.position   = [ MONO ]
            }
        }
    }

    # EVO entradas 1-4 → sumador.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Mezcla: entradas 1-4"
            capture.props = {
                node.name           = "mezcla.entradas"
                state.restore-props = false
                audio.position      = [ AUX0 AUX1 AUX2 AUX3 ]
                target.object       = "alsa_input.usb-Audient_EVO8-00.pro-input-0"
                stream.dont-remix   = true
                node.passive        = true
                node.dont-fallback  = true
                node.linger         = true
            }
            playback.props = {
                node.name           = "mezcla.entradas.out"
                state.restore-props = false
                audio.position      = [ FL FR SL SR ]
                target.object       = "mezcla.suma"
                stream.dont-remix   = true
                node.dont-fallback  = true
                node.linger         = true
            }
        }
    }

    # Salida virtual "Compartido" → salida seleccionada (sin target fijo: sigue
    # a la salida por defecto como cualquier app).
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Compartido"
            capture.props = {
                node.name        = "Compartido"
                node.description = "Compartido"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = {
                node.name        = "mezcla.compartido.escucha"
                state.restore-props = false
                node.description = "Compartido (escucha)"
                audio.position   = [ FL FR ]
            }
        }
    }

    # Lo que suena en "Compartido" → sumador.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Mezcla: Compartido"
            capture.props = {
                node.name           = "mezcla.compartido"
                state.restore-props = false
                audio.position      = [ FL FR ]
                target.object       = "Compartido"
                stream.capture.sink = true
                stream.dont-remix   = true
                node.passive        = true
                node.dont-fallback  = true
                node.linger         = true
            }
            playback.props = {
                node.name           = "mezcla.compartido.out"
                state.restore-props = false
                audio.position      = [ RL RR ]
                target.object       = "mezcla.suma"
                stream.dont-remix   = true
                node.dont-fallback  = true
                node.linger         = true
            }
        }
    }
]
